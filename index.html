<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">

    <!-- display and theme control -->
    <div class="display-wrap">
      <button id="theme-toggle" aria-label="Switch to dark mode">
        <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="moon-icon" d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/>
          <g class="sun-icon">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </g>
        </svg>
      </button>
      <div class="display" id="display" role="status" aria-live="polite" aria-label="Calculator display">0</div>
    </div>

    <!-- display divider -->
    <div class="seam" aria-hidden="true"></div>

    <!-- calculator keypad -->
    <div class="buttons">
      <button class="btn util clear" data-action="clear" aria-label="Clear">C</button>
      <button class="btn util back" data-action="backspace" aria-label="Backspace, delete last character">←</button>
      <button class="btn op op-div" data-action="append" data-value="/" aria-label="Divide">÷</button>

      <button class="btn num n7" data-action="append" data-value="7">7</button>
      <button class="btn num n8" data-action="append" data-value="8">8</button>
      <button class="btn num n9" data-action="append" data-value="9">9</button>
      <button class="btn op op-mul" data-action="append" data-value="*" aria-label="Multiply">×</button>

      <button class="btn num n4" data-action="append" data-value="4">4</button>
      <button class="btn num n5" data-action="append" data-value="5">5</button>
      <button class="btn num n6" data-action="append" data-value="6">6</button>
      <button class="btn op op-sub" data-action="append" data-value="-" aria-label="Subtract">−</button>

      <button class="btn num n1" data-action="append" data-value="1">1</button>
      <button class="btn num n2" data-action="append" data-value="2">2</button>
      <button class="btn num n3" data-action="append" data-value="3">3</button>
      <button class="btn op op-add" data-action="append" data-value="+" aria-label="Add">+</button>

      <button class="btn num zero" data-action="append" data-value="0">0</button>
      <button class="btn num dot" data-action="append" data-value="." aria-label="Decimal point">.</button>
      <button class="btn equal" data-action="calculate" aria-label="Equals">=</button>
    </div>
  </div>

  <script src="calculator-engine.js"></script>
  <script src="input-state.js"></script>
  <script src="script.js"></script>
</body>
</html>
